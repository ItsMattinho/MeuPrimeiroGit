<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Minha Lanchonete</title>
    <link rel="stylesheet" href="contato.css">
</head>
<body>

    <header>
        <h1>Entre em Contato</h1>
        <p>
            Entre em contato conosco para tirar dúvidas,
            enviar sugestões ou deixar uma mensagem.
        </p>
    </header>

    <main>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>Projeto desenvolvido por Matteo Fernandes</p>
    </footer>

</body>
</html>
